services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speech_doc_extractor_api_real
    ports:
      - "8000:8000"
    environment:
      - SPEECH_PROVIDER=whisper
      - OCR_PROVIDER=paddleocr
      - WHISPER_MODEL_SIZE=base
      - PADDLE_LANG=en
      - LOG_LEVEL=INFO
      - MAX_FILE_SIZE_MB=25
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
